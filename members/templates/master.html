{% load bootstrap5 %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Tennis Club{% endblock %}</title>
  {% bootstrap_css %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'main' %}">My Tennis Club</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavigation">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'main' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'members' %}">Members</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  {% include "footer.html" %}
  {% bootstrap_javascript %}
</body>
</html>
